# Generated by quoll — https://github.com/theo-mrn/Quoll
# Do not edit by hand: change quoll.toml, then run `quoll k8s update`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  # A new version takes traffic once ready; the old one stays until then.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            # The app's secrets (DATABASE_URL...): kubectl create secret generic {{ .Values.envFromSecret }} --from-env-file=...
            - secretRef:
                name: {{ .Values.envFromSecret }}
                optional: true
          {{- end }}
          startupProbe:
            {{- include "app.probe" . | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            {{- include "app.probe" . | nindent 12 }}
            periodSeconds: 5
          livenessProbe:
            {{- include "app.probe" . | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: [ALL]
          {{- if and .Values.readOnlyRootFilesystem .Values.writablePaths }}
          volumeMounts:
            {{- range $i, $path := .Values.writablePaths }}
            - name: writable-{{ $i }}
              mountPath: {{ $path }}
            {{- end }}
          {{- end }}
      {{- if and .Values.readOnlyRootFilesystem .Values.writablePaths }}
      volumes:
        {{- range $i, $path := .Values.writablePaths }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
      {{- end }}
