[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quoll-cli"
version = "0.2.0"
description = "Production-grade CI, Dockerfiles, Helm charts and delivery for any repository, kept in sync with one quoll.toml"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "theo-mrn", email = "theo.morin1402@gmail.com" }
]
keywords = ["cli", "ci", "cd", "devops", "github-actions", "gitlab-ci", "docker", "kubernetes", "helm", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "questionary>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "PyNaCl>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/theo-mrn/Quoll"
Repository = "https://github.com/theo-mrn/Quoll"
Issues = "https://github.com/theo-mrn/Quoll/issues"

[project.scripts]
quoll = "quoll.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0",
    "ruff>=0.6.0",
    "actionlint-py>=1.7.0",
    "shellcheck-py>=0.10.0",
    "check-jsonschema>=0.33.0",
]

[tool.hatch.build.targets.wheel]
packages = ["quoll"]

# Only what the package is made of: no local files (notes, editor or tool settings) in the source distribution.
[tool.hatch.build.targets.sdist]
include = ["quoll", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: Typer declares options as default arguments. B904: `raise typer.Exit` inside except is intended.
ignore = ["B008", "B904"]

[tool.coverage.run]
source = ["quoll"]
