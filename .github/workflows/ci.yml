# Generated by quoll — https://github.com/theo-mrn/Quoll
# Do not edit by hand: change quoll.toml, then run `quoll ci update`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install CI tools
        run: pip install ruff

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: "Test (${{ matrix.python-version }})"
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install CI tools
        run: pip install pytest pytest-cov

      - name: Tests with coverage
        run: pytest --cov=quoll --cov-report=xml --cov-report=term-missing --cov-fail-under=75 --junitxml=junit.xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          report_paths: junit.xml
          annotate_only: true
          detailed_summary: true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install CI tools
        run: pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    container: "ghcr.io/gitleaks/gitleaks:v8.30.1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Secret scanning
        run: gitleaks git --redact --verbose .

  sbom:
    name: SBOM and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Trivy
        run: |
          if ! command -v curl >/dev/null; then
            apt-get update -qq && apt-get install -y -qq curl ca-certificates
          fi
          arch=$(uname -m | sed 's/x86_64/64bit/; s/aarch64/ARM64/')
          mkdir -p /tmp/trivy
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-$arch.tar.gz" \
            | tar -xz -C /tmp/trivy trivy

      - name: SBOM (CycloneDX)
        run: /tmp/trivy/trivy rootfs --quiet --skip-dirs .go,.cargo,.m2,.gradle,.cache,.npm,.pnpm-store,.yarn/cache,.yarn-cache,.nuget,.sonar,build --format cyclonedx --output sbom.cdx.json .

      - name: License check
        run: /tmp/trivy/trivy rootfs --quiet --skip-dirs .go,.cargo,.m2,.gradle,.cache,.npm,.pnpm-store,.yarn/cache,.yarn-cache,.nuget,.sonar,build --scanners license --severity CRITICAL --exit-code 1 .

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.cdx.json

  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    container: "semgrep/semgrep:1.185.0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Static analysis
        run: semgrep scan --config p/default --severity ERROR --error --metrics off .

  build:
    name: Build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Build
        run: |
          pip install build
          python -m build

  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, test, audit, secrets, sbom, sast, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
