name: quoll setup

description: "Set up python and install the dependencies, as quoll's CI does. Use after checkout."

inputs:
  version:
    description: "python-version (default: the latest of [ci] versions)"
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.version }}
        cache: pip
        cache-dependency-path: |
          **/requirements*.txt
          **/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      shell: bash
